# ===================================================
# 1. CONFIGURACIÓN DE BASE DE DATOS (H2 POR DEFECTO / POSTGRESQL OPCIONAL)
# ===================================================
# Para evitar loops de reinicio y problemas con la carga de drivers en bases de datos H2:
spring.devtools.restart.exclude=data/**,static/**,public/**,frontend/**,build/**,target/**,node_modules/**,generated/**
spring.devtools.restart.additional-exclude=data/**
# Desactivamos las propiedades automáticas de DevTools para mayor estabilidad con Hikari/H2
spring.devtools.add-properties=true
spring.sql.init.mode=never
spring.devtools.restart.trigger-file=.reload

# Para usar PostgreSQL localmente, puede descomentar estas líneas o definir variables de entorno:
# spring.datasource.url=jdbc:postgresql://localhost:5432/club_judo
# spring.datasource.username=postgres
# spring.datasource.password=tu_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/judo_db;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Configuración estándar del driver
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway para migraciones de esquema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.create-schemas=true

# ===================================================
# 2. CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================

# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Optimización del Pool de Conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=JudoClubHikariPool
# ===================================================
# 3. SERVICIO DE CORREO (MAILTRAP - PRUEBAS)
