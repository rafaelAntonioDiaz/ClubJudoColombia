# Base de datos en memoria H2 para pruebas rápidas
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway activo para pruebas para validar los scripts
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hibernate ajustará discrepancias menores de tipos en H2
spring.jpa.hibernate.ddl-auto=update